name: Build Android APK

# 云端构建高仿微信 App 的 Debug APK。
# 本机无需安装 Android Studio / JDK，推送到 GitHub 后自动出包，
# 在 Actions 运行页的 Artifacts 里下载 apk 即可安装测试。

on:
  # 手动触发（Actions 页面点 "Run workflow"）
  workflow_dispatch:
  # 推送到这些分支时自动构建
  push:
    branches:
      - main
      - android
    paths:
      - "packages/web/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不指定 version：由根 package.json 的 packageManager 字段决定（pnpm 9.1.3），
      # 同时指定两处会触发 ERR_PNPM_BAD_PM_VERSION
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Capacitor 8 + AGP 8.13 + compileSdk 36 需要 JDK 21（17 会构建失败）
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu runner 已预装 Android SDK（ANDROID_HOME/ANDROID_SDK_ROOT 均已设置），
      # 无需第三方 setup-android action。这里只做校验并接受 licenses，
      # 缺失的 build-tools / platform 由 Gradle 自动下载。
      - name: Verify Android SDK & accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "licenses accepted"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (App mode)
        working-directory: packages/web
        env:
          # 强制开启 App 模式：全屏微信界面、隐藏开发面板、启用移动端长按编辑
          VITE_APP_MODE: "true"
        run: pnpm run build

      # 必须在 cap sync 之前：cap sync 内部会调用 gradlew 解析原生插件，
      # 而 gradlew 从 Windows 提交时可能丢失可执行权限位
      - name: Grant execute permission for gradlew
        working-directory: packages/web/android
        run: chmod +x ./gradlew

      - name: Capacitor sync
        working-directory: packages/web
        run: pnpm exec cap sync android --verbose

      - name: Build Debug APK
        working-directory: packages/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-fake-debug-apk
          path: packages/web/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
