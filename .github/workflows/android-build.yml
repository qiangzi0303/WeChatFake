name: Build Android APK

# 云端构建高仿微信 App 的 Debug APK。
# 本机无需安装 Android Studio / JDK，推送到 GitHub 后自动出包，
# 在 Actions 运行页的 Artifacts 里下载 apk 即可安装测试。

on:
  # 手动触发（Actions 页面点 "Run workflow"）
  workflow_dispatch:
  # 推送到这些分支时自动构建
  push:
    branches:
      - main
      - android
    paths:
      - "packages/web/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (App mode)
        working-directory: packages/web
        env:
          # 强制开启 App 模式：全屏微信界面、隐藏开发面板、启用移动端长按编辑
          VITE_APP_MODE: "true"
        run: pnpm run build

      - name: Capacitor sync
        working-directory: packages/web
        run: pnpm exec cap sync android

      - name: Grant execute permission for gradlew
        working-directory: packages/web/android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: packages/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wechat-fake-debug-apk
          path: packages/web/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
